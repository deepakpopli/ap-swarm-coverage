[project]
name = "swarm-coverage"
version = "0.1.0"
description = "Resilient multi-drone area coverage on ArduPilot SITL"
requires-python = ">=3.10"
dependencies = ["pymavlink", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: real-time or subprocess tests (run them with -m slow)"]
# Slow tests are opt-in. The -p no: entries switch off the ROS 2 plugins that hook test
# collection when /opt/ros is on PYTHONPATH; without ROS installed they are ignored.
addopts = "-m 'not slow' -p no:launch_testing -p no:launch_pytest -p no:launch_ros"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
