[project]
name = "swarm-coverage"
version = "0.1.0"
description = "Resilient multi-drone area coverage on ArduPilot SITL"
requires-python = ">=3.10"
dependencies = ["pymavlink", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: real-time or subprocess tests (run them with -m slow)"]
# slow tests are opt-in; the ROS 2 launch plugins (on PYTHONPATH when ROS is sourced) break collection
addopts = "-m 'not slow' -p no:launch_testing -p no:launch_pytest -p no:launch_ros"

[tool.ruff]
line-length = 100
extend-exclude = ["swarm/swarm_mav.py"]   # generated by ./setup.sh --mavgen

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
